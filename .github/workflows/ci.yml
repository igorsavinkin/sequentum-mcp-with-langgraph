name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check-secret:
    runs-on: ubuntu-latest
    outputs:
      has-secret: ${{ steps.check.outputs.has-secret }}
    steps:
      - id: check
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "has-secret=false" >> $GITHUB_OUTPUT
          else
            echo "has-secret=true" >> $GITHUB_OUTPUT
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.14]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pip install pytest
          PYTHONPATH=${{ github.workspace }} pytest -q

  chroma_index:
    needs: check-secret
    if: ${{ needs.check-secret.outputs.has-secret == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Chroma index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/build_chroma_index.py --persist_dir chroma_db

      - name: Upload Chroma DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: chroma_db
          path: chroma_db